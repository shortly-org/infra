name: chart

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  CHART: shortly-service
  REGISTRY: ${{ vars.ECR_REGISTRY }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.22.0 }
      - run: helm lint "charts/$CHART" --set image.repository=lint --set image.digest=sha256:0

  publish:
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Tag is a plain semantic version (vMAJOR.MINOR.PATCH)
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a release tag (vMAJOR.MINOR.PATCH)"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_ECR_PUSH_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - uses: azure/setup-helm@v4
        with: { version: v3.22.0 }
      - name: Package the chart as the release's version and push it to ECR
        run: |
          version="${TAG#v}"
          helm package "charts/$CHART" --version "$version"
          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login --username AWS --password-stdin "$REGISTRY"
          helm push "$CHART-$version.tgz" "oci://$REGISTRY/charts"
